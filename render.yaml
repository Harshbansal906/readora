# =========================================================================
# READORA — Render Infrastructure as Code (Blueprint Specification)
# Docs: https://render.com/docs/blueprint-spec
# =========================================================================

databases:
  - name: readora-db
    databaseName: readora
    user: readora
    plan: free
    ipAllowList: [] # internal access only from Render services

services:
  - type: web
    name: readora
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: readora-db
          property: connectionString

      # Cloudinary Permanent Media Storage (Optional, recommended for user photos)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # Resend HTTP Email API (Recommended for cloud deliverability)
      - key: RESEND_API_KEY
        sync: false

      - key: FROM_EMAIL
        value: READORA <onboarding@resend.dev>

      # Gmail SMTP Fallback (Optional)
      - key: GMAIL_USER
        sync: false

      - key: GMAIL_APP_PASS
        sync: false

      # Google Gemini AI Integration (Optional)
      - key: GEMINI_API_KEY
        sync: false
